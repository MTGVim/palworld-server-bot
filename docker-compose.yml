services:
  palbot:
    image: ghcr.io/mtgvim/palworld-server-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: "여기에_봇_토큰"
      SERVER_URL: "http://172.17.0.1:8212"
      ADMIN_PASSWORD: "여기에_관리자_비밀번호"
      ADMIN_USER_IDS: "여기에_디스코드_관리자_ID(쉼표로_복수_지정)"
      BOT_UPDATE_ENABLED: "true"
      STATUS_CHANNEL_ID: ""
      WATCHTOWER_IMAGE: "containrrr/watchtower:latest"
      BOT_IMAGE_REF: "ghcr.io/mtgvim/palworld-server-bot:latest"
      RPS_STATS_PATH: "/app/data/rps-stats.json"
      RPS_PERSIST_LOG_INTERVAL: "20"
      RPS_RANKING_MIN_GAMES_FOR_WIN_RATE: "10"
      BOJ_SEARCH_API_URL: "https://solved.ac/api/v3/search/problem"
      BOJ_FETCH_TIMEOUT_MS: "5000"
      BOJ_TODAY_CACHE_PATH: "/app/data/boj-today.json"
      BOJ_TODAY_TIMEZONE: "Asia/Seoul"

      # 플레이어 조회/유휴 경고 설정
      AUTO_PAUSE_TIMEOUT: "300"
      CHECK_INTERVAL: "10000"
      PLAYERS_API_TIMEOUT_MS: "5000"
      STABLE_ZERO_REQUIRED_SAMPLES: "2"
      NON_ZERO_GRACE_SECONDS: "20"
      # 참고: palworld-server 일시중지 상태 로그는 코드에서 상태 전환 시 1회만 출력

      # 선택: RCON 관련
      RCON_HOST: 172.17.0.1
      RCON_PORT: "25575"
      RCON_PASSWORD: "여기에_RCON_비밀번호"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # RPS 전적 영속화 필수: 컨테이너 교체/재시작 후에도 /app/data 유지
      - ./data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
